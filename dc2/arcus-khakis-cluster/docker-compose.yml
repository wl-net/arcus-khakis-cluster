services:
  cassandra-0:
    extends:
      file: ../../compose/common.yml
      service: cassandra
    environment:
      CASSANDRA_SEEDS: 192.168.1.10,cassandra-0
      CASSANDRA_DC: DC2
    volumes:
    - cassandra-storage-0:/data
    networks:
      arcus:
        ipv4_address: 192.168.2.10
  cassandra-1:
    extends:
      file: ../../compose/common.yml
      service: cassandra
    environment:
      CASSANDRA_SEEDS: 192.168.1.10,cassandra-0
      CASSANDRA_DC: DC2
    volumes:
    - cassandra-storage-1:/data
    networks:
      arcus:
        ipv4_address: 192.168.2.11
  cassandra-2:
    extends:
      file: ../../compose/common.yml
      service: cassandra
    environment:
      CASSANDRA_SEEDS: 192.168.1.10,cassandra-0
      CASSANDRA_DC: DC2
    volumes:
    - cassandra-storage-2:/data
    networks:
      arcus:
        ipv4_address: 192.168.2.12
  zookeeper-0:
    extends:
      file: ../../compose/common.yml
      service: zookeeper
    environment:
      ZOO_MY_ID: 2
    networks:
      arcus:
        ipv4_address: 192.168.2.13
  cassandra-repair:
    extends:
      file: ../../compose/common.yml
      service: cassandra-repair
    environment:
      REPAIR_HOUR: 6
  kafka-0:
    extends:
      file: ../../compose/common.yml
      service: kafka
    environment:
      KAFKA_BROKER_ID: 2
      ADVERTISED_HSTN: 192.168.2.14
      KAFKA_BROKER_RACK: dc2
    networks:
      arcus:
        ipv4_address: 192.168.2.14

volumes:
  cassandra-storage-0:
  cassandra-storage-1:
  cassandra-storage-2:
  zookeeper-0:
  kafka-0:

networks:
  arcus:
    driver: macvlan
    driver_opts:
      parent: br0
    ipam:
      config:
      - subnet: 192.168.2.0/24
        gateway: 192.168.2.1
