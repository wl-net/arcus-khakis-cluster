# Shared service definitions for all DCs. The per-DC compose files extend
# these and override only what differs between DCs: addresses, identities,
# seeds, and schedules. This file is not a valid project on its own.
#
# mem_limit caps resident memory so one runaway container can't take the
# host down (DC hosts have ~4.8 GiB and run three Cassandra nodes plus
# Kafka). Limits are caps, not reservations: they sum past physical RAM on
# purpose. Swap is left available — the hosts run overcommitted and
# forbidding it would trade thrash for host-level OOM kills.
x-logging: &default-logging
  options:
    max-size: 50m

services:
  cassandra:
    image: ghcr.io/wl-net/arcusplatform/arcus-cassandra:2026.10.2
    environment:
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 256M
    ports:
    - 7000
    - 7001
    - 7199
    - 9042
    - 9160
    volumes:
    # Logs on tmpfs (image can't write to /var/log/cassandra on disk), but
    # capped: an uncapped tmpfs can grow to half the host's RAM
    - type: tmpfs
      target: /var/log/cassandra
      tmpfs:
        size: 134217728 # 128 MiB (startup logging alone reaches ~52 MiB)
    ulimits:
      memlock: -1
      nofile: 100000
    # Cassandra flushes memtables on SIGTERM; the 10s default means SIGKILL
    # mid-flush and commitlog replay on every restart
    stop_grace_period: 2m
    # Observed ~1.2 GiB (768M heap + off-heap); headroom for repair spikes
    mem_limit: 1792m
    restart: always
    logging: *default-logging

  zookeeper:
    image: zookeeper:3.8.7
    environment:
      ZOO_SERVERS: server.1=192.168.1.13:2888:3888;2181 server.2=192.168.2.13:2888:3888;2181 server.3=192.168.3.13:2888:3888;2181
      # The image default (2 ticks = 4s) is LAN tuning: any 4s blip on a VPN
      # tunnel drops the follower and forces an election
      ZOO_SYNC_LIMIT: 10
      # Image default heap is 1000m, which would outgrow mem_limit and get
      # the JVM OOM-killed; observed usage is ~60 MiB
      ZK_SERVER_HEAP: 256
    ports:
    - 2181
    mem_limit: 512m
    volumes:
    - zookeeper-0:/data
    # The image's txn logs live in /datalog; without a named volume they
    # land on an anonymous one that 'compose down' discards
    - zookeeper-0-datalog:/datalog
    restart: always
    logging: *default-logging

  cassandra-repair:
    image: docker:cli
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ../repair:/repair:ro
    entrypoint: /repair/entrypoint.sh
    mem_limit: 256m
    restart: always
    logging: *default-logging

  cassandra-backup:
    image: docker:cli
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ../backup:/backup:ro
    - /var/backups/arcus-khakis-cluster:/backups
    entrypoint: /backup/entrypoint.sh
    mem_limit: 256m
    restart: always
    logging: *default-logging

  kafka:
    image: ghcr.io/wl-net/arcusplatform/arcus-kafka:2026.10.2
    environment:
      # All three ensemble members: pinned to the local member alone, the
      # broker's session expires whenever that one server blips instead of
      # failing over and keeping its registration
      ZOOKEEPER: 192.168.1.13:2181,192.168.2.13:2181,192.168.3.13:2181
      ZOOKEEPEROPS: 192.168.1.13:2181,192.168.2.13:2181,192.168.3.13:2181
      KAFKA_HSIZE: 512
      KAFAOPS_METRICS_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 10485760
      KAFAOPS_METRICS_LOG_RETENTION_MS: 3600000
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_RETENTION_MS: 3600000
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_REPLICATOR_SELECTOR_CLASS: org.apache.kafka.common.replica.RackAwareReplicaSelector
      KAFKA_PROTOCOL_VERSION: 2.6
      KAFKA_LOG_MESSAGE_VERSION: 2.6
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    restart: always
    stop_grace_period: 1m
    # Observed ~420 MiB with the 512M heap; the rest is page cache
    mem_limit: 1g
    ports:
    - 9092
    volumes:
    - kafka-0:/data
    logging: *default-logging
