name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck -x arcuscmd.sh repair/cassandra-repair.sh repair/entrypoint.sh backup/cassandra-backup.sh backup/entrypoint.sh

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          for dc in dc1 dc2 dc3; do
            echo "::group::$dc"
            docker compose -f "$dc/arcus-khakis-cluster/docker-compose.yml" config
            echo "::endgroup::"
          done
      - name: DC1 and DC2 resolve identically apart from DC specifics
        run: |
          for dc in dc1 dc2; do
            docker compose -f "$dc/arcus-khakis-cluster/docker-compose.yml" config \
              | sed -E 's/192\.168\.[12]\./192.168.N./g; s/: DC[12]$/: DCN/; s/: dc[12]$/: dcN/' \
              | grep -vE 'ZOO_MY_ID|KAFKA_BROKER_ID|REPAIR_HOUR|BACKUP_DAY|BACKUP_HOUR|CASSANDRA_SEEDS' > "/tmp/$dc-normalized.yml"
          done
          diff -u /tmp/dc1-normalized.yml /tmp/dc2-normalized.yml

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Help prints without docker
        run: |
          output=$(./arcuscmd.sh help)
          echo "$output"
          echo "$output" | grep -q 'deploy'
      - name: Root guard rejects running as root
        run: |
          output=$(sudo ./arcuscmd.sh help 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q 'Do not run arcuscmd as root'
      - name: Unknown subcommand exits non-zero
        run: |
          if ./arcuscmd.sh notarealcommand 2>&1; then
            echo "Expected non-zero exit for unknown subcommand"
            exit 1
          fi
