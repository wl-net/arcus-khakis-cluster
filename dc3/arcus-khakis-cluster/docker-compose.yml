services:
  zookeeper-0:
    extends:
      file: ../../compose/common.yml
      service: zookeeper
    environment:
      ZOO_MY_ID: 3
    networks:
      arcus:
        ipv4_address: 192.168.3.13

volumes:
  cassandra-storage-0:
  cassandra-storage-1:
  cassandra-storage-2:
  zookeeper-0:
networks:
  private:

  arcus:
    driver: macvlan
    driver_opts:
      parent: br0
    ipam:
      config:
      - subnet: 192.168.3.0/24
        gateway: 192.168.3.1
